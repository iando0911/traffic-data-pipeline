name: 交通事故分析自動部署

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每週一凌晨 2 點自動更新

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis pipeline
        run: python main.py

      - name: Move outputs to root for Pages
        run: |
          cp output/report.html report.html
          cp output/*.html .
          cp output/stats_summary.json .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
