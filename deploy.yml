name: Traffic ETL — Docker Build → AWS S3 + GitHub Pages

on:
  # 每日 UTC 08:00（台灣時間 16:00）自動觸發
  schedule:
    - cron: "0 8 * * *"
  # 手動觸發（可傳入年度參數）
  workflow_dispatch:
    inputs:
      target_year:
        description: "民國年份（例如 115）"
        required: false
        default: "115"
  push:
    branches: [main]

permissions:
  contents: write        # GitHub Pages 部署需要
  pages: write
  id-token: write        # OIDC → AWS 認證（比長效金鑰更安全）

# 同一時間只允許一個部署流程，避免競態
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Job 1：建置 Docker 映像並執行 ETL
  # ────────────────────────────────────────────
  build-and-run:
    name: "🐳 Build Docker & Run ETL"
    runs-on: ubuntu-latest

    outputs:
      artifact-name: dashboard-output   # 傳給下游 job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker 建置快取（加速 CI，不重複 pip install）──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── 建置映像（不推送 registry，僅本機使用）──
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true                     # 載入至本機 docker daemon
          tags: traffic-etl:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 避免快取無限成長
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 執行 ETL，將產出物寫到 ./output ──
      - name: Run ETL pipeline in Docker
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm \
            -e TARGET_YEAR=${{ github.event.inputs.target_year || '115' }} \
            -e OUTPUT_DIR=/app/output \
            -v ${{ github.workspace }}/output:/app/output \
            traffic-etl:ci

      # ── 上傳產出物供後續 job 使用 ──
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: output/
          retention-days: 3


  # ────────────────────────────────────────────
  # Job 2：部署到 AWS S3 + CloudFront
  # ────────────────────────────────────────────
  deploy-aws:
    name: "☁️  Deploy to AWS S3 + CloudFront"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment: production              # 可在 Settings → Environments 設保護規則

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      # ── OIDC 免金鑰認證（推薦）──
      # 需先在 AWS IAM 設定 GitHub OIDC Provider & Role
      # 詳見 aws/iam-oidc-setup.md
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1     # 東京（台灣最近）

      # ── 同步至 S3（刪除舊檔、設 Cache-Control）──
      - name: Sync to S3
        run: |
          aws s3 sync output/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600, must-revalidate" \
            --metadata-directive REPLACE

          # HTML 不快取，確保使用者每次取最新版
          aws s3 cp output/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      # ── 清除 CloudFront 快取，使新版立即生效 ──
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Print deployment URL
        run: |
          echo "✅ AWS 部署完成"
          echo "🌐 URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"


  # ────────────────────────────────────────────
  # Job 3：同時部署到 GitHub Pages（保留原有管道）
  # ────────────────────────────────────────────
  deploy-pages:
    name: "📄 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build-and-run

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print GitHub Pages URL
        run: echo "✅ GitHub Pages 部署完成：${{ steps.deployment.outputs.page_url }}"
