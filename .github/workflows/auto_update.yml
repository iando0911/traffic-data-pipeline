name: Traffic Data Auto Pipeline

on:
  schedule:
    # 這裡使用 Cron 語法：每月 1 號的凌晨 2 點 (UTC 時間) 自動執行
    - cron: '0 2 1 * *'
  workflow_dispatch: # 允許你隨時在 GitHub 網頁上手動點擊執行測試

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 使用 Ubuntu 虛擬機

    steps:
      - name: 📥 檢出程式碼 (Checkout Repo)
        uses: actions/checkout@v3

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 🚀 執行 ETL 管線與地圖渲染
        run: |
          python main.py

      - name: 📤 自動提交並推送到 GitHub Pages (部署)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update: 最新交通肇事熱點數據"
          file_pattern: index.html # 只把新產生的網頁檔推上去
