name: Traffic Data Auto Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 1 * *' # 每月1號的 UTC 02:00 (台灣時間 10:00) 自動執行
  workflow_dispatch:   # 允許手動點擊按鈕觸發

permissions:
  contents: write      # 允許讀寫儲存庫內容
  pages: write         # 部署 GitHub Pages 必備權限
  id-token: write      # OIDC 登入 AWS 必備權限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run pipeline
        run: python main.py

      - name: 📁 Prepare Pages folder
        run: |
          mkdir -p pages_deploy
          cp output/*.html pages_deploy/
          cp output/*.json pages_deploy/

      # ─── 第一階段：部署到 GitHub Pages ─────────────────────────
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_deploy

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ─── 第二階段：部署到 AWS S3 + CloudFront ─────────────────
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 💡 提示：請至 AWS IAM 檢查您的 OIDC Role，並將下方的 12 碼帳號與角色名稱換成實際的
          role-to-assume: arn:aws:iam::123456789012:role/你的-github-actions-role
          # 💡 核心修正：根據您的 S3 機房，區域請填入雪梨節點 ap-southeast-2
          aws-region: ap-southeast-2

      - name: ☁️ Deploy to AWS S3
        run: |
          # 💡 核心修正：已自動替換為您成功建立的 Bucket 名稱 "my-project-0604"
          aws s3 sync pages_deploy/ s3://my-project-0604 --delete

      - name: 🔄 Invalidate CloudFront Cache
        run: |
          # 💡 提示：請將下方 "E1CTGVABV9XOHG" 替換為您在 CloudFront 列表中看到的真實 Distribution ID
          aws cloudfront create-invalidation --distribution-id E1CTGVABV9XOHG --paths "/*"
