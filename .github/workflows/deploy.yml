name: Traffic ETL — Docker Build → AWS S3 + GitHub Pages

on:
  # 每日 UTC 08:00（台灣時間 16:00）自動觸發
  schedule:
    - cron: "0 8 * * *"
  # 手動觸發（可傳入年度參數）
  workflow_dispatch:
    inputs:
      target_year:
        description: "民國年份（例如 115）"
        required: false
        default: "115"
  push:
    branches: [main]

permissions:
  contents: read   # ETL 不需要寫回 repo
  pages: write
  id-token: write  # OIDC → AWS 認證（比長效金鑰更安全）

# 同一時間只允許一個部署流程，避免競態
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Job 1：安全掃描 + 單元測試 + Docker 建置 + 執行 ETL
  # ────────────────────────────────────────────
  build-and-run:
    name: "🐳 Build Docker & Run ETL"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整 history，確保 git rev-parse --short HEAD 可用

      # ── 🔍 安全漏洞掃描（pip-audit 在 runner 直接跑，不進 Docker）────
      - name: Set up Python for audit & tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies（僅供 pip-audit / pytest 使用，ETL 由 Docker 執行）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output json \
            --output-file pip-audit-report.json || true
          pip-audit -r requirements.txt || true

      - name: 📋 Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      # ── 🧪 單元測試（有 tests/ 才跑，無則略過）──────────────────────
      - name: 🧪 Run unit tests
        run: |
          if [ -d "tests/" ] && [ -n "$(ls -A tests/)" ]; then
            PYTHONPATH=. pytest tests/ -v --tb=short --junitxml=test-results.xml
          else
            echo "⚠️ tests/ 目錄不存在或為空，略過單元測試"
          fi

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 30

      # ── 🐳 Docker 建置（含 layer 快取，加速 CI）─────────────────────
      - name: Build Docker image
        run: docker build -t traffic-etl:local .

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🔨 Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true        # 載入至本機 docker daemon，不推送 registry
          tags: traffic-etl:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 🚀 執行 ETL（完全在 Docker container 內）────────────────────
      # ETL 只下載政府開放資料並產生靜態檔案，不需要也不傳入任何 AWS 憑證
      - name: 🚀 Run ETL pipeline in Docker
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm \
            -e TARGET_YEAR=${{ github.event.inputs.target_year || '115' }} \
            -e OUTPUT_DIR=/app/output \
            -e GITHUB_SHA=${{ github.sha }} \
            -v ${{ github.workspace }}/output:/app/output \
            traffic-etl:ci

      # ── ✅ 驗證 output/ 包含所有必要前端文件 ──────────────────────────
      - name: ✅ Verify output completeness
        run: |
          echo "📂 output/ 目錄內容："
          ls -lh output/
          echo ""
          REQUIRED_FILES=("index.html" "app.js" "style.css" "dashboard_data.json" "heatmap.html")
          MISSING=()
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "output/$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 缺少必要文件：${MISSING[*]}"
            exit 1
          else
            echo "✅ 所有必要文件均存在"
          fi

      # ── 📤 上傳產出物供後續 job（deploy-aws / deploy-pages）使用 ─────
      - name: 📤 Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: output/
          retention-days: 3


  # ────────────────────────────────────────────
  # Job 2：部署到 AWS S3 + CloudFront
  # AWS 憑證只在此 job 取得，完全不進入 Docker container
  # ────────────────────────────────────────────
  deploy-aws:
    name: "☁️ Deploy to AWS S3 + CloudFront"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment: production

    steps:
      # dashboard-output 是一般 artifact（非 Pages 格式），下載後直接是展開的檔案，無 tar 包裝
      - name: 📥 Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: site-deploy/

      - name: 🔍 Verify downloaded files
        run: |
          echo "📂 site-deploy/ 內容："
          ls -lh site-deploy/

      # ── OIDC 免金鑰認證──────────────────────────────────────────────
      - name: 🔑 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      # ── 同步至 S3──────────────────────────────────────────────────
      - name: ☁️ Sync to S3
        run: |
          # 同步所有靜態資源（1 小時快取）
          aws s3 sync site-deploy/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600, must-revalidate" \
            --metadata-directive REPLACE

          # index.html 單獨覆寫（不快取，確保使用者每次取最新版）
          aws s3 cp site-deploy/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: 🔄 Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: 🎉 Print deployment URL
        run: |
          echo "✅ AWS 部署完成"
          echo "🌐 URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"


  # ────────────────────────────────────────────
  # Job 3：部署到 GitHub Pages（備援）
  # ────────────────────────────────────────────
  deploy-pages:
    name: "📄 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: site-deploy/

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v4

      # upload-pages-artifact 將 site-deploy/ 打包成 Pages 專用格式
      # deploy-pages 直接消費，不需要手動解壓縮
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-deploy/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Print GitHub Pages URL
        run: echo "✅ GitHub Pages 部署完成：${{ steps.deployment.outputs.page_url }}"
