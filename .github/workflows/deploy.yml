# 台灣交通事故大數據分析管線 - 雲端部署工作流 v2.1
name: Traffic Data Auto Pipeline

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run ETL Pipeline
        run: python main.py

      - name: 📁 Prepare Web Assets
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp output/*.html _site/
          cp output/*.json _site/

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-aws:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743181156800:role/github-actions-deploy-role
          aws-region: us-east-1

      - name: 📁 Download build results
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: ☁️ Sync to S3
        run: |
          tar -xvf _site/artifact.tar -C _site/
          aws s3 sync _site/ s3://my-project-0604 --delete

          # HTML 不快取，確保使用者每次取最新版
          aws s3 cp _site/index.html s3://my-project-0604/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: 🔄 Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E67OCAJE5TI9T \
            --paths "/*"
