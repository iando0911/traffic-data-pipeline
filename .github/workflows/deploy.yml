name: Traffic ETL — Docker Build → AWS S3 + GitHub Pages

on:
  # 每日 UTC 08:00（台灣時間 16:00）自動觸發
  schedule:
    - cron: "0 8 * * *"

  # 手動觸發（可傳入年度參數）
  workflow_dispatch:
    inputs:
      target_year:
        description: "民國年份（例如 115）"
        required: false
        default: "115"

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    name: "🐳 Build Docker & Run ETL"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python for audit & tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies for audit & tests
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt 不存在，略過專案依賴安裝"
          fi

          pip install pytest pip-audit

      - name: 🔍 Security audit (pip-audit)
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt --output json \
              --output-file pip-audit-report.json || true

            pip-audit -r requirements.txt || true
          else
            echo "{}" > pip-audit-report.json
            echo "⚠️ requirements.txt 不存在，略過 pip-audit"
          fi

      - name: 📋 Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: 🧪 Run unit tests
        run: |
          if [ -d "tests/" ] && [ -n "$(ls -A tests/)" ]; then
            PYTHONPATH=. pytest tests/ -v --tb=short --junitxml=test-results.xml
          else
            echo "⚠️ tests/ 目錄不存在或為空，略過單元測試"
          fi

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: 🐳 Show Docker version
        run: |
          docker version
          docker info

      - name: 🔨 Build Docker image
        run: |
          docker build -t traffic-etl:ci .

      - name: 🔎 Inspect Docker image
        run: |
          docker image inspect traffic-etl:ci

      - name: 🚀 Run ETL pipeline in Docker
        run: |
          mkdir -p "${{ github.workspace }}/output"

          docker run --rm \
            -e TARGET_YEAR=${{ github.event.inputs.target_year || '115' }} \
            -e OUTPUT_DIR=/app/output \
            -e GITHUB_SHA=${{ github.sha }} \
            -v "${{ github.workspace }}/output:/app/output" \
            traffic-etl:ci

      - name: ✅ Verify output completeness
        run: |
          echo "📂 output/ 目錄內容："
          ls -lh output/
          echo ""

          REQUIRED_FILES=(
            "index.html"
            "app.js"
            "style.css"
            "dashboard_data.json"
            "heatmap.html"
          )

          MISSING=()

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "output/$f" ]; then
              MISSING+=("$f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 缺少必要文件：${MISSING[*]}"
            exit 1
          fi

          echo "✅ 所有必要文件均存在"

      - name: ✅ Verify SaaS dashboard features
        run: |
          echo "🔍 驗證 SaaS 前端功能是否已輸出"

          grep -q "subscription-status" output/index.html
          grep -q "subscriber-count" output/index.html
          grep -q "notification-list" output/index.html
          grep -q "activity-list" output/index.html
          grep -q "api-status" output/index.html
          grep -q "health-check-btn" output/index.html

          grep -q "SubscriptionService" output/app.js
          grep -q "NotificationService" output/app.js
          grep -q "ActivityLogService" output/app.js
          grep -q "CONFIG" output/app.js

          grep -q "saas-overview" output/style.css
          grep -q "toast-container" output/style.css
          grep -q "status-pill" output/style.css
          grep -q "event-list" output/style.css

          echo "✅ SaaS Dashboard 功能驗證完成"

      - name: ✅ Verify cloud architecture files
        run: |
          echo "🔍 檢查 aws/ 目錄"

          if [ -d "aws" ]; then
            echo "✅ aws/ 目錄存在"
            find aws -maxdepth 3 -type f | sort
          else
            echo "⚠️ aws/ 目錄不存在，若要強調 AWS 架構，建議補上 CloudFormation / Lambda / SNS 文件"
          fi

      - name: 📤 Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: output/
          retention-days: 3

  deploy-aws:
    name: "☁️ Deploy to AWS S3 + CloudFront"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment: production
    if: >-
      ${{
        secrets.AWS_OIDC_ROLE_ARN != '' &&
        secrets.S3_BUCKET_NAME != '' &&
        secrets.CLOUDFRONT_DIST_ID != '' &&
        secrets.CLOUDFRONT_DOMAIN != ''
      }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: site-deploy/

      - name: 🔍 Verify downloaded files
        run: |
          echo "📂 site-deploy/ 內容："
          ls -lh site-deploy/

      - name: 🔑 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: ☁️ Sync to S3
        run: |
          aws s3 sync site-deploy/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600, must-revalidate" \
            --metadata-directive REPLACE

          aws s3 cp site-deploy/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: 🔄 Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: 🎉 Print deployment URL
        run: |
          echo "✅ AWS 部署完成"
          echo "🌐 URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"

  deploy-pages:
    name: "📄 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build-and-run

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: site-deploy/

      - name: 🔍 Verify Pages files
        run: |
          echo "📂 site-deploy/ 內容："
          ls -lh site-deploy/
          test -f site-deploy/index.html
          test -f site-deploy/app.js
          test -f site-deploy/style.css

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-deploy/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}

      - name: 🎉 Print GitHub Pages URL
        run: |
          echo "✅ GitHub Pages 部署完成：${{ steps.deployment.outputs.page_url }}"
