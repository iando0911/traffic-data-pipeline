name: Traffic ETL — Docker Build → AWS S3 + GitHub Pages

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_year:
        description: "民國年份（例如 115）"
        required: false
        default: "115"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Job 1：建置 Docker 映像並執行 ETL
  # ────────────────────────────────────────────
  build-and-run:
    name: "🐳 Build Docker & Run ETL"
    runs-on: ubuntu-latest

    outputs:
      artifact-name: dashboard-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 🔍 安全漏洞掃描 ──────────────────────────────────
      - name: Set up Python for audit & tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Security audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output json \
            --output-file pip-audit-report.json || true
          pip-audit -r requirements.txt

      - name: 📋 Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      # ── 🧪 單元測試 ──────────────────────────────────────
      - name: 🧪 Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      # ── Docker 建置快取 ───────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: traffic-etl:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 執行 ETL ─────────────────────────────────────────
      - name: Run ETL pipeline in Docker
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm \
            -e TARGET_YEAR=${{ github.event.inputs.target_year || '115' }} \
            -e OUTPUT_DIR=/app/output \
            -e GITHUB_SHA=${{ github.sha }} \
            -v ${{ github.workspace }}/output:/app/output \
            traffic-etl:ci

      # ── ★ 合併 web/ 靜態檔到 output/ ────────────────────
      # web/ 內有 index.html、app.js、style.css 等前端檔案；
      # ETL 產出的 dashboard_data.json 等在 output/；
      # 兩者必須合併後才能一起部署，否則 S3 上只有資料沒有前端。
      - name: 🗂 Merge web/ static files into output/
        run: cp -r web/. output/

      # ── 上傳產出物 ────────────────────────────────────────
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: output/
          retention-days: 3


  # ────────────────────────────────────────────
  # Job 2：部署到 AWS S3 + CloudFront
  # ────────────────────────────────────────────
  deploy-aws:
    name: "☁️  Deploy to AWS S3 + CloudFront"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment: production

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: |
          aws s3 sync output/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600, must-revalidate" \
            --metadata-directive REPLACE

          # HTML 不快取，確保使用者每次取最新版
          aws s3 cp output/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Print deployment URL
        run: |
          echo "✅ AWS 部署完成"
          echo "🌐 URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"


  # ────────────────────────────────────────────
  # Job 3：部署到 GitHub Pages（保留原有管道）
  # ────────────────────────────────────────────
  deploy-pages:
    name: "📄 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build-and-run

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print GitHub Pages URL
        run: echo "✅ GitHub Pages 部署完成：${{ steps.deployment.outputs.page_url }}"
