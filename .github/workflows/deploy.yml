name: Traffic ETL — Docker Build → AWS S3 + GitHub Pages

on:
  # 每日 UTC 08:00（台灣時間 16:00）自動觸發
  schedule:
    - cron: "0 8 * * *"
  # 手動觸發（可傳入年度參數）
  workflow_dispatch:
    inputs:
      target_year:
        description: "民國年份（例如 115）"
        required: false
        default: "115"
  push:
    branches: [main]

permissions:
  contents: write        # GitHub Pages 部署需要
  pages: write
  id-token: write        # OIDC → AWS 認證（比長效金鑰更安全）

# 同一時間只允許一個部署流程，避免競態
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────
  # Job 1：建置 Docker 映像並執行 ETL
  # ────────────────────────────────────────────
  build-and-run:
    name: "🐳 Build Docker & Run ETL"
    runs-on: ubuntu-latest

    outputs:
      artifact-name: dashboard-output

    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 完整 history，確保 git rev-parse --short HEAD 可用
          fetch-depth: 0

      # 1. 在這裡增加這一步，換取短效憑證
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      # ── 🔍 安全漏洞掃描 ──────────────────────────────────
      - name: Set up Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Security audit
        run: |
          pip install pip-audit
          # 同時輸出 JSON（供後續 artifact 上傳）與人類可讀格式（顯示於 log）
          pip-audit -r requirements.txt --output json \
            --output-file pip-audit-report.json || true
          pip-audit -r requirements.txt || true

      - name: 📋 Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      # ── 🧪 單元測試（有 tests/ 才跑，無則略過）─────────────
      - name: 🧪 Run unit tests
        run: |
          if [ -d "tests/" ] && [ -n "$(ls -A tests/)" ]; then
            # <--- 加入 PYTHONPATH=. 確保 pytest 能夠正確載入專案根目錄的 main.py
            PYTHONPATH=. pytest tests/ -v --tb=short --junitxml=test-results.xml
          else
            echo "⚠️  tests/ 目錄不存在或為空，略過單元測試"
            echo "   建議補充測試：tests/test_utils.py（見 README 說明）"
          fi

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          # 找不到檔案時不報錯（tests/ 不存在時不會產生此檔）
          if-no-files-found: ignore
          retention-days: 30

      # ── Docker 建置快取（加速 CI，不重複 pip install）──────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── 建置映像（不推送 registry，僅本機使用）────────────
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true                     # 載入至本機 docker daemon
          tags: traffic-etl:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 避免快取無限成長
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 執行 ETL，將產出物寫到 ./output ──────────────────
      # main.py v2.4 會自動將 web/ 靜態文件複製到 output/
      # 2. 修改 Run ETL 的步驟，將憑證注入進去
      - name: Run ETL pipeline in Docker
        run: |
          mkdir -p ${{ github.workspace }}/output
          # 將 runner 的 AWS 環境變數傳進 Docker
          docker run --rm \
            -e TARGET_YEAR=${{ github.event.inputs.target_year || '115' }} \
            -e OUTPUT_DIR=/app/output \
            -e GITHUB_SHA=${{ github.sha }} \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN \
            -v ${{ github.workspace }}/output:/app/output \
            traffic-etl:ci

      # ── 驗證 output/ 包含必要的前端文件 ──────────────────
      - name: Verify output completeness
        run: |
          echo "📂 output/ 目錄內容："
          ls -lh output/
          echo ""
          REQUIRED_FILES=("index.html" "app.js" "style.css" "dashboard_data.json" "heatmap.html")
          MISSING=()
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "output/$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 缺少必要文件：${MISSING[*]}"
            exit 1
          else
            echo "✅ 所有必要文件均存在"
          fi

      # ── 上傳產出物供後續 job 使用 ──────────────────────────
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-output
          path: output/
          retention-days: 3


  # ────────────────────────────────────────────
  # Job 2：部署到 AWS S3 + CloudFront
  # ────────────────────────────────────────────
  deploy-aws:
    name: "☁️  Deploy to AWS S3 + CloudFront"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment: production

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      # ── OIDC 免金鑰認證（推薦）────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1     # 東京（台灣最近）

      # ── 同步至 S3（刪除舊檔、設 Cache-Control）────────────
      - name: Sync to S3
        run: |
          aws s3 sync output/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600, must-revalidate" \
            --metadata-directive REPLACE

          # HTML 不快取，確保使用者每次取最新版
          aws s3 cp output/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      # ── 清除 CloudFront 快取，使新版立即生效 ──────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      - name: Print deployment URL
        run: |
          echo "✅ AWS 部署完成"
          echo "🌐 URL: https://${{ secrets.CLOUDFRONT_DOMAIN }}"


  # ────────────────────────────────────────────
  # Job 3：同時部署到 GitHub Pages（保留原有管道）
  # ────────────────────────────────────────────
  deploy-pages:
    name: "📄 Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build-and-run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-output
          path: output/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print GitHub Pages URL
        run: echo "✅ GitHub Pages 部署完成：${{ steps.deployment.outputs.page_url }}"
