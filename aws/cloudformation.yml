AWSTemplateFormatVersion: "2010-09-09"

Description: >
Traffic Data Pipeline SaaS Dashboard cloud infrastructure.
This template creates a private S3 bucket, CloudFront distribution,
Origin Access Control, and bucket policy for secure static hosting.

Metadata:
Project:
Name: Traffic Data Pipeline SaaS
CourseTopic: Docker, AWS, GitHub Actions CI/CD, SaaS Dashboard
Repository: iando0911/traffic-data-pipeline

Parameters:
ProjectName:
Type: String
Default: traffic-dashboard
Description: Resource name prefix. Used for S3 bucket and CloudFront resource naming.
AllowedPattern: "^[a-z0-9-]+$"
ConstraintDescription: ProjectName must contain only lowercase letters, numbers, and hyphens.

PriceClass:
Type: String
Default: PriceClass_200
Description: CloudFront price class. PriceClass_200 includes Asia Pacific edge locations.
AllowedValues:
- PriceClass_100
- PriceClass_200
- PriceClass_All

EnableVersioning:
Type: String
Default: "true"
Description: Enable S3 bucket versioning for rollback support.
AllowedValues:
- "true"
- "false"

NoncurrentVersionExpirationDays:
Type: Number
Default: 30
MinValue: 1
MaxValue: 365
Description: Number of days to retain noncurrent S3 object versions.

Conditions:
ShouldEnableVersioning: !Equals [!Ref EnableVersioning, "true"]

Resources:

# ────────────────────────────────────────────

# 1. Private S3 Bucket for static dashboard files

# ────────────────────────────────────────────

DashboardBucket:
Type: AWS::S3::Bucket
DeletionPolicy: Retain
UpdateReplacePolicy: Retain
Properties:
BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"

```
  OwnershipControls:
    Rules:
      - ObjectOwnership: BucketOwnerEnforced

  PublicAccessBlockConfiguration:
    BlockPublicAcls: true
    BlockPublicPolicy: true
    IgnorePublicAcls: true
    RestrictPublicBuckets: true

  VersioningConfiguration:
    Status: !If
      - ShouldEnableVersioning
      - Enabled
      - Suspended

  LifecycleConfiguration:
    Rules:
      - Id: DeleteOldNoncurrentVersions
        Status: Enabled
        NoncurrentVersionExpiration:
          NoncurrentDays: !Ref NoncurrentVersionExpirationDays

  Tags:
    - Key: Project
      Value: !Ref ProjectName
    - Key: ManagedBy
      Value: CloudFormation
    - Key: Application
      Value: TrafficDataPipelineSaaS
```

# ────────────────────────────────────────────

# 2. CloudFront Origin Access Control

# Allows CloudFront to access private S3 origin using signed requests.

# ────────────────────────────────────────────

DashboardOriginAccessControl:
Type: AWS::CloudFront::OriginAccessControl
Properties:
OriginAccessControlConfig:
Name: !Sub "${ProjectName}-s3-oac"
Description: !Sub "OAC for ${ProjectName} private S3 origin"
OriginAccessControlOriginType: s3
SigningBehavior: always
SigningProtocol: sigv4

# ────────────────────────────────────────────

# 3. CloudFront Distribution

# ────────────────────────────────────────────

DashboardDistribution:
Type: AWS::CloudFront::Distribution
Properties:
DistributionConfig:
Enabled: true
Comment: !Sub "${ProjectName} Traffic Data Pipeline SaaS Dashboard"
DefaultRootObject: index.html
PriceClass: !Ref PriceClass
HttpVersion: http2and3
IPV6Enabled: true

```
    Origins:
      - Id: DashboardS3Origin
        DomainName: !GetAtt DashboardBucket.RegionalDomainName
        OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
        S3OriginConfig:
          OriginAccessIdentity: ""

    DefaultCacheBehavior:
      TargetOriginId: DashboardS3Origin
      ViewerProtocolPolicy: redirect-to-https
      AllowedMethods:
        - GET
        - HEAD
        - OPTIONS
      CachedMethods:
        - GET
        - HEAD
      Compress: true

      # AWS managed policy: CachingOptimized
      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

      # AWS managed policy: SecurityHeadersPolicy
      ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

    CustomErrorResponses:
      - ErrorCode: 403
        ResponseCode: 200
        ResponsePagePath: /index.html
        ErrorCachingMinTTL: 0
      - ErrorCode: 404
        ResponseCode: 200
        ResponsePagePath: /index.html
        ErrorCachingMinTTL: 0

    ViewerCertificate:
      CloudFrontDefaultCertificate: true
      MinimumProtocolVersion: TLSv1

  Tags:
    - Key: Project
      Value: !Ref ProjectName
    - Key: ManagedBy
      Value: CloudFormation
    - Key: Application
      Value: TrafficDataPipelineSaaS
```

# ────────────────────────────────────────────

# 4. S3 Bucket Policy

# Only this CloudFront distribution can read objects from the bucket.

# ────────────────────────────────────────────

DashboardBucketPolicy:
Type: AWS::S3::BucketPolicy
Properties:
Bucket: !Ref DashboardBucket
PolicyDocument:
Version: "2012-10-17"
Statement:
- Sid: AllowCloudFrontServicePrincipalReadOnly
Effect: Allow
Principal:
Service: cloudfront.amazonaws.com
Action:
- s3:GetObject
Resource: !Sub "arn:aws:s3:::${DashboardBucket}/*"
Condition:
StringEquals:
AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

Outputs:
S3BucketName:
Description: S3 bucket name. Add this value to GitHub Secret S3_BUCKET_NAME.
Value: !Ref DashboardBucket
Export:
Name: !Sub "${ProjectName}-S3BucketName"

S3BucketRegionalDomainName:
Description: Regional domain name of the private S3 bucket.
Value: !GetAtt DashboardBucket.RegionalDomainName
Export:
Name: !Sub "${ProjectName}-S3BucketRegionalDomainName"

CloudFrontDistributionId:
Description: CloudFront Distribution ID. Add this value to GitHub Secret CLOUDFRONT_DIST_ID.
Value: !Ref DashboardDistribution
Export:
Name: !Sub "${ProjectName}-CloudFrontDistributionId"

CloudFrontDomain:
Description: CloudFront domain name. Add this value to GitHub Secret CLOUDFRONT_DOMAIN.
Value: !GetAtt DashboardDistribution.DomainName
Export:
Name: !Sub "${ProjectName}-CloudFrontDomain"

CloudFrontURL:
Description: Public HTTPS URL for the SaaS dashboard.
Value: !Sub "https://${DashboardDistribution.DomainName}"
Export:
Name: !Sub "${ProjectName}-CloudFrontURL"

OriginAccessControlId:
Description: CloudFront Origin Access Control ID.
Value: !GetAtt DashboardOriginAccessControl.Id
Export:
Name: !Sub "${ProjectName}-OriginAccessControlId"
